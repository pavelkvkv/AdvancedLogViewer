name: Code Quality & Build

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black
      
      - name: Check code formatting with black
        run: black --check AdvancedLogViewer.py
        continue-on-error: true
      
      - name: Lint with flake8
        run: |
          flake8 AdvancedLogViewer.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 AdvancedLogViewer.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

  build:
    name: Build Executable
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9']
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build with PyInstaller
        run: pyinstaller AdvancedLogViewer.spec
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: AdvancedLogViewer-${{ matrix.os }}
          path: dist/
          retention-days: 5
